spring.application.name=SM_entraprises
spring.data.mongodb.database=SM_Entraprises
# The connection string (with the password) is never committed. Set MONGODB_URI in the environment,
# or put MONGODB_URI=... in local.properties at the project root (git-ignored).
spring.config.import=optional:file:./local.properties
spring.data.mongodb.uri=${MONGODB_URI}
